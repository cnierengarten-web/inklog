name: CI

on:
  push: { branches: [ main ] }
  pull_request: { branches: [ main ] }

defaults:
  run:
    working-directory: apps/inklog

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: sqlite3, pdo_sqlite, intl, mbstring, dom, json, xml

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: ${{ runner.os }}-composer-${{ hashFiles('apps/inklog/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Reset SQLite DB file
        run: rm -f var/test.db

      - name: Run tests
        run: vendor/bin/simple-phpunit --testdox
