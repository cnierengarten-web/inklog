<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#cffafe"/>
      <stop offset="100%" stop-color="#ede9fe"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg3)"/>

  <!-- doodles -->
  <g stroke="#a3a3a3" stroke-width="2" opacity="0.35">
    <path d="M140 160c60 30 120 30 180 0" fill="none"/>
    <path d="M1280 720c40 20 80 20 120 0" fill="none"/>
    <circle cx="260" cy="180" r="6" fill="#a3a3a3"/>
    <circle cx="1440" cy="700" r="6" fill="#a3a3a3"/>
  </g>

  <g filter="url(#soft)">
    <!-- card -->
    <rect x="350" y="180" width="900" height="540" rx="24" fill="#ffffff"/>
    <rect x="390" y="220" width="820" height="460" rx="16" fill="#f8fafc" stroke="#e5e7eb"/>
    <!-- friendly camera mascot -->
    <g transform="translate(800,450)">
      <rect x="-140" y="-90" width="280" height="180" rx="24" fill="#93c5fd" stroke="#60a5fa" stroke-width="6"/>
      <rect x="-170" y="-120" width="80" height="40" rx="10" fill="#60a5fa"/>
      <circle cx="0" cy="0" r="50" fill="#fff" stroke="#2563eb" stroke-width="10"/>
      <circle cx="0" cy="0" r="16" fill="#60a5fa"/>
      <circle cx="60" cy="-40" r="10" fill="#1d4ed8"/>
      <!-- smile -->
      <path d="M-60 40 Q0 70 60 40" fill="none" stroke="#1d4ed8" stroke-width="8" stroke-linecap="round"/>
    </g>
    <text x="800" y="610" text-anchor="middle" font-family="system-ui,Segoe UI,Roboto,Arial" font-size="28" fill="#64748b">Aperçu en cours…</text>
  </g>
</svg>